[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbccps-od"
version = "0.1.0"
description = "Nighttime streetlight object-detection package with baseline YOLOv26 and modular advanced pipeline hooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "SQLAlchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0",
  "PyYAML>=6.0.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
train = ["ultralytics==8.4.51", "pillow>=10.0.0", "wandb>=0.17.0"]
deployment = [
    "onnx==1.22.0",
    "onnxruntime==1.27.0",
    "onnxslim==0.1.94",
    "tensorflow==2.19.0",
    "onnx2tf==1.28.8",
    "ai-edge-litert==2.1.6",
    "ncnn==1.0.20260526",
]
measurement = ["numpy>=1.26.0", "pillow>=10.0.0", "opencv-python>=4.9.0", "torch>=2.3.0"]
annotator = ["opencv-python>=4.9.0", "numpy>=1.26.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
rbccps-measurement = "rbccps_measurement.cli.main:main"
rbccps-annotator = "rbccps_annotator.cli:main"

[tool.setuptools]
packages = [
    "rbccps_measurement",
    "rbccps_measurement.attribution",
    "rbccps_measurement.cli",
    "rbccps_measurement.config",
    "rbccps_measurement.contracts",
    "rbccps_measurement.dataset_prep",
    "rbccps_measurement.decomposition",
    "rbccps_measurement.evaluation",
    "rbccps_measurement.features",
    "rbccps_measurement.fusion",
    "rbccps_measurement.geometry",
    "rbccps_measurement.ingest",
    "rbccps_measurement.normalization",
    "rbccps_measurement.photometry",
    "rbccps_measurement.reporting",
    "rbccps_measurement.route",
    "rbccps_measurement.segmentation",
    "rbccps_measurement.status",
    "rbccps_measurement.training",
    "rbccps_od",
    "rbccps_od.config",
    "rbccps_od.data_management",
    "rbccps_od.domain",
    "rbccps_od.evaluation",
    "rbccps_od.io",
    "rbccps_od.models",
    "rbccps_od.pipeline",
    "rbccps_od.review",
    "rbccps_od.training",
    "rbccps_annotator",
    "tracker",
    "evaluation",
    "evaluation.eval_pres",
]

[tool.setuptools.package-dir]
rbccps_measurement = "src/measurement"
"rbccps_measurement.attribution" = "src/measurement/attribution"
"rbccps_measurement.cli" = "src/measurement/cli"
"rbccps_measurement.config" = "src/measurement/config"
"rbccps_measurement.contracts" = "src/measurement/contracts"
"rbccps_measurement.dataset_prep" = "src/measurement/dataset_prep"
"rbccps_measurement.decomposition" = "src/measurement/decomposition"
"rbccps_measurement.evaluation" = "src/measurement/evaluation"
"rbccps_measurement.features" = "src/measurement/features"
"rbccps_measurement.fusion" = "src/measurement/fusion"
"rbccps_measurement.geometry" = "src/measurement/geometry"
"rbccps_measurement.ingest" = "src/measurement/ingest"
"rbccps_measurement.normalization" = "src/measurement/normalization"
"rbccps_measurement.photometry" = "src/measurement/photometry"
"rbccps_measurement.reporting" = "src/measurement/reporting"
"rbccps_measurement.route" = "src/measurement/route"
"rbccps_measurement.segmentation" = "src/measurement/segmentation"
"rbccps_measurement.status" = "src/measurement/status"
"rbccps_measurement.training" = "src/measurement/training"
rbccps_od = "src/detection"
"rbccps_od.config" = "src/detection/config"
"rbccps_od.data_management" = "src/detection/data_management"
"rbccps_od.domain" = "src/detection/domain"
"rbccps_od.evaluation" = "src/detection/evaluation"
"rbccps_od.io" = "src/detection/io"
"rbccps_od.models" = "src/detection/models"
"rbccps_od.pipeline" = "src/detection/pipeline"
"rbccps_od.review" = "src/detection/review"
"rbccps_od.training" = "src/detection/training"
rbccps_annotator = "src/annotator"
tracker = "src/tracker"
evaluation = "src/evaluation"
"evaluation.eval_pres" = "src/evaluation/eval_pres"

[tool.setuptools.package-data]
rbccps_annotator = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
